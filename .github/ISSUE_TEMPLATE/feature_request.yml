name: Feature request
description: Suggest an improvement to an existing skill or audit behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the gap in the current audit output.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would the improved behavior look like?
      description: Describe the finding, check, or recommendation you would like the skill to produce.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
